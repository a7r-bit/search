stages:
    - build
    - deploy

workflow:
    rules:
        - if: '$CI_COMMIT_BRANCH == "dev"'

variables:
    CI_REGISTRY_IMAGE: dockerhub.mingas.by/search
    CI_REGISTRY_IMAGE_MIGRATE: ${CI_REGISTRY_IMAGE}-migrate

build-migrate-job:
    stage: build
    tags:
        - search
    script:
        - docker build -f ./docker/Dockerfile.migrate -t ${CI_REGISTRY_IMAGE_MIGRATE}:$CI_COMMIT_SHORT_SHA .

build-app-job:
    stage: build
    tags:
        - search
    script:
        - docker build -f ./docker/Dockerfile --target runner -t ${CI_REGISTRY_IMAGE}:$CI_COMMIT_SHORT_SHA .

deploy-job:
    stage: deploy
    tags:
        - search
    needs:
        - build-migrate-job
        - build-app-job
    environment:
        name: dev
    script:
        - test -n "$ENV_FILE" || { echo "ENV_FILE is not set in CI/CD variables"; exit 1; }
        - echo "--- env file keys ---" && grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' "$ENV_FILE" | sort -u
        - test -n "$(grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' "$ENV_FILE" | head -1)" || { echo "env file has no KEY=VALUE lines"; exit 1; }
        - sed -e '1s/^\xef\xbb\xbf//' -e 's/^export //' -e 's/\r$//' "$ENV_FILE" > "${ENV_FILE}.clean"
        - export ENV_FILE="${ENV_FILE}.clean"
        - export COMPOSE_ARGS="--env-file $ENV_FILE"
        - docker compose config -q
        - docker compose --profile migrate run --rm migrate
        - docker compose up -d
