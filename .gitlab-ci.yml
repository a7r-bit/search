stages:
    - build
    - deploy

variables:
    SHORT_NAME: search
    CI_REGISTRY_IMAGE: dockerhub.mingas.by/${SHORT_NAME}
    CI_REGISTRY_IMAGE_MIGRATE: dockerhub.mingas.by/${SHORT_NAME}-migrate

build-migrate-job:
    stage: build
    only:
        - dev
    tags:
        - search
    script:
        - docker build -f ./docker/Dockerfile.migrate --build-arg BUILDKIT_INLINE_CACHE=1 -t ${CI_REGISTRY_IMAGE_MIGRATE}:$CI_COMMIT_SHORT_SHA .

build-app-job:
    stage: build
    only:
        - dev
    tags:
        - search
    script:
        - docker build -f ./docker/Dockerfile --build-arg BUILDKIT_INLINE_CACHE=1 -t ${CI_REGISTRY_IMAGE}:$CI_COMMIT_SHORT_SHA .

deploy-job:
    stage: deploy
    needs:
        - build-migrate-job
        - build-app-job
    only:
        - dev
    tags:
        - search
    script:
        - export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
        - export CI_REGISTRY_IMAGE_MIGRATE=$CI_REGISTRY_IMAGE_MIGRATE
        - export CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA
        - docker compose --env-file "$ENV_FILE" config -q
        - docker compose --env-file "$ENV_FILE" --profile migrate run --rm migrate
        - docker compose --env-file "$ENV_FILE" up -d
        # - docker system prune -a -f
    environment:
        name: dev
